name: Selfhosted Tizen Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Write local.properties
        run: |
          cp local.example.properties local.properties
          sed -i \
            -e "s|^SUPABASE_URL=.*|SUPABASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}|" \
            -e "s|^SUPABASE_ANON_KEY=.*|SUPABASE_ANON_KEY=${{ secrets.NUVIO_SUPABASE_ANON_KEY }}|" \
            -e "s|^TV_LOGIN_REDIRECT_BASE_URL=.*|TV_LOGIN_REDIRECT_BASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}/tv-login|" \
            -e "s|^AVATAR_PUBLIC_BASE_URL=.*|AVATAR_PUBLIC_BASE_URL=${{ secrets.NUVIO_SUPABASE_URL }}/storage/v1/object/public/avatars|" \
            local.properties

      - run: npm install
      - run: npm run build
      - run: npm run package:tizen

      - name: Upload WGT
        uses: actions/upload-artifact@v4
        with:
          name: nuvio-selfhosted-tizen
          path: '**/*.wgt'
